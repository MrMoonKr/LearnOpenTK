[paths]
; Steam Dota 2 installation folder, not the game/dota subfolder.
game_root = C:\Program Files (x86)\Steam\steamapps\common\dota 2 beta

[model]
; models/heroes/<name>/<name>.vmdl, without the trailing _c.
path = models/heroes/antimage/antimage.vmdl

[instancing]
; Instances are arranged in a rows x columns grid, spacing world units apart (Source hammer units).
; Each instance cycles through the model's own animation list, offset in time, so no two look alike.
rows = 5
columns = 5
spacing = 250
