[paths]
; Steam Dota 2 installation folder, not the game/dota subfolder.
game_root = C:\Program Files (x86)\Steam\steamapps\common\dota 2 beta

[model]
; Unused by this project (heroes are picked from the tree view, backed by scripts/npc/npc_heroes.txt);
; kept only so config.ini shares the same [model] section as the other Dota 2 examples.
path = models/heroes/antimage/antimage.vmdl

[character]
; Hero spawned on startup; must be a valid npc_dota_hero_* name (see the tree view for the full roster).
initial_hero = npc_dota_hero_axe
; World units (Source hammer units) per second while a movement key is held.
move_speed = 220
; Vertical takeoff speed (world units/second) applied on a Space press while grounded.
jump_speed = 320

[world]
; Half-extent of the flat ground quad, in Source hammer units, centered at the origin.
ground_half_size = 2000
; Downward acceleration (world units/second^2) applied every frame; also determines jump height/arc
; together with jump_speed above.
gravity = 800
