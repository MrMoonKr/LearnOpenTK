[paths]
; Steam Dota 2 installation folder, not the game/dota subfolder.
game_root = C:\Program Files (x86)\Steam\steamapps\common\dota 2 beta

[model]
; Unused by this project (heroes are picked from scripts/npc/npc_heroes.txt instead); kept only so
; config.ini shares the same [model] section as the other Dota 2 examples.
path = models/heroes/antimage/antimage.vmdl

[characters]
; How many heroes to place (Axe is always one of them) and how far apart, in Source hammer units.
count = 7
spacing = 300
; Fixes which heroes get picked, for reproducible testing. Omit for a fresh random pick each run,
; or use File > Reroll Heroes in the running app to pick again without restarting.
; seed = 12345
